
services:
  flask-app:
    image: ghcr.io/santho2003/devops-cicd-pipeline:latest

    container_name: devops-flask-app

    ports:
      - "5000:5000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
