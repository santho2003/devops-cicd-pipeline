
name: Python CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write


jobs:
  test-and-build:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t devops-flask-app:${{ github.sha }} .

      - name: Start container for smoke test
        run: docker run -d -p 127.0.0.1:5000:5000 --name ci-smoke-container devops-flask-app:${{ github.sha }}

      - name: Verify container health
        run: |
          for i in $(seq 1 20); do
            if curl --connect-timeout 2 --max-time 3 -fsS http://127.0.0.1:5000/health | grep -q healthy; then
              echo "Container health check passed!"
              exit 0
            fi
            sleep 1
          done

          echo "Container health check failed!"
          docker logs ci-smoke-container
          exit 1

      
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_NAME="$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')"

          docker tag "devops-flask-app:$IMAGE_TAG" "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "devops-flask-app:$IMAGE_TAG" "$IMAGE_NAME:latest"

          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:latest"

      - name: Cleanup test container
        if: always()
        run: docker rm -f ci-smoke-container || true

  deploy:
    name: Deploy to Windows Machine
    needs: test-and-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows, X64]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest Docker image
        run: docker compose pull

      - name: Deploy application
        run: docker compose up -d

      
      - name: Verify deployment health
        shell: powershell
        run: |
          $healthy = $false

          for ($i = 1; $i -le 20; $i++) {
              try {
                  $response = Invoke-RestMethod `
                      -Uri "http://localhost:5000/health" `
                      -TimeoutSec 3

                  if ($response.status -eq "healthy") {
                      Write-Host "Deployment health check passed!"
                      $healthy = $true
                      break
                  }
              }
              catch {
                  Write-Host "Waiting for application... Attempt $i"
              }

              Start-Sleep -Seconds 2
          }

          if (-not $healthy) {
              docker compose logs
              throw "Deployment health check failed!"
          }
